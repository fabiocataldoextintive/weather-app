<section class="detail-panel" i18n-aria-label="@@detail.section" aria-label="Detailed weather">
  @if (displayRoot(); as root) {
    <app-current-weather-card [root]="root" [favoriteLabel]="activeLocationLabel()" />
  } @else if (!loadingWeather() && !weatherError() && !validationMessage()) {
    <p class="status status--muted" i18n="@@detail.emptyHint">Search for a city to see the forecast.</p>
  }
</section>
