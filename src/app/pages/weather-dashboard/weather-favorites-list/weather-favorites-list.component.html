<section class="favorites" [attr.aria-label]="'favorites.section' | i18n">
  <h2 class="favorites__title">{{ 'favorites.title' | i18n }}</h2>

  @if (favoritesCount() > 0) {
    <ul class="favorites__list">
      @for (favorite of favoritesOrdered(); track favorite.cityLabel) {
        <li class="favorites__item" [class.favorites__item--active]="isActive(favorite)">
          <button
            type="button"
            class="favorites__select"
            (click)="selectFavorite(favorite)"
            [attr.aria-label]="'favorites.loadCity' | i18n: { city: favorite.cityLabel }"
          >
            <span class="favorites__star" aria-hidden="true">★</span>
            <span class="favorites__label">{{ favorite.cityLabel }}</span>
          </button>
          <button
            type="button"
            class="favorites__remove"
            (click)="removeFavorite(favorite, $event)"
            [attr.aria-label]="'favorites.remove' | i18n: { city: favorite.cityLabel }"
          >
            <span aria-hidden="true">×</span>
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="favorites__empty">{{ 'favorites.emptyHint' | i18n }}</p>
  }
</section>
